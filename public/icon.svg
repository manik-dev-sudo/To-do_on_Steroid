<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Outer Neon Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Center Glowing Core -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Lightning Bolt (AI Power) -->
  <path d="M280 120 L180 270 L250 270 L230 392 L340 236 L270 236 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M280 120 L180 270 L250 270 L230 392 L340 236 L270 236 Z" fill="#ffffff" opacity="0.9" />

  <!-- Checkmark Badge on Bottom Right -->
  <circle cx="360" cy="360" r="64" fill="#0f172a" stroke="#10b981" stroke-width="6" filter="url(#glow)" />
  <path d="M336 360 L352 376 L386 342" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mic Symbol Badge on Top Left -->
  <circle cx="152" cy="152" r="48" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="4" />
  <rect x="144" y="132" width="16" height="26" rx="8" fill="#c084fc" />
  <path d="M136 148 C136 160 168 160 168 148" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  <line x1="152" y1="160" x2="152" y2="170" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
</svg>
